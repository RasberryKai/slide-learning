name: SlideLearning
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
targets:
  SlideLearning:
    type: application
    platform: macOS
    info:
      path: SlideLearning/Info.plist
    sources:
      - path: SlideLearning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaikuppers.SlideLearning
        PRODUCT_NAME: SlideLearning
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - SlideLearningTests
  SlideLearningTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SlideLearningTests
    dependencies:
      - target: SlideLearning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kaikuppers.SlideLearningTests

  SlideLearningIPad:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SlideLearningIPad
      - path: SlideLearning/Domain
      - path: SlideLearning/Persistence
      - path: SlideLearning/PDF
      - path: SlideLearning/Features
    info:
      path: SlideLearningIPad/Info.plist
      properties:
        CFBundleDisplayName: Slide Learning
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaikuppers.SlideLearning.ipad
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SlideLearningIPadTests
        - SlideLearningIPadUITests
  SlideLearningIPadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SlideLearningTests
    dependencies:
      - target: SlideLearningIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kaikuppers.SlideLearning.ipad.tests
        TARGETED_DEVICE_FAMILY: "2"

  SlideLearningIPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SlideLearningIPadUITests
    dependencies:
      - target: SlideLearningIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kaikuppers.SlideLearning.ipad.uitests
        TARGETED_DEVICE_FAMILY: "2"
